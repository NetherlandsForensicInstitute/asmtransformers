name: asmtransformers

on:
  push:
    branches: ['main']
    paths: ['asmtransformers/**']
  pull_request:
    paths: ['asmtransformers/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.13'
          cache: true
          cache-dependency-path: 'pdm.lock'
      - run: pdm install --group check --no-default
      - run: pdm run check
        working-directory: asmtransformers/
  test:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.13'
          cache: true
          cache-dependency-path: 'pdm.lock'
      - run: pdm install --group test
      - run: pdm run test
        working-directory: asmtransformers/
